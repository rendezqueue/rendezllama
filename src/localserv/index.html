<!DOCTYPE html>
<html>
  <head>
    <title>AI Assistant Chat</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f0f0f0;
      }
      /* Tabs */
      #tabs {
        display: flex;
        margin-bottom: 0;
      }
      .tab-button {
        padding: 10px 20px;
        background-color: #ddd;
        border: 1px solid #ccc;
        border-bottom: none;
        border-radius: 8px 8px 0 0;
        cursor: pointer;
        margin-right: 5px;
        font-weight: bold;
      }
      .tab-button.active {
        background-color: white;
        border-bottom: 1px solid white;
        margin-bottom: -1px;
        z-index: 1;
      }
      .tab-content {
        display: none;
        background-color: white;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 0 8px 8px 8px;
      }
      .tab-content.active {
        display: block;
      }

      #chat-container {
        height: 60vh;
        overflow-y: auto;
        border: 1px solid #ccc;
        background-color: #f9f9f9;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
      }
      .message {
        margin-bottom: 10px;
        padding: 10px 15px;
        border-radius: 20px;
        max-width: 70%;
        line-height: 1.4;
      }
      .user-message {
        align-self: flex-end;
        background-color: #007bff;
        color: white;
        border-bottom-right-radius: 5px;
      }
      .assistant-message {
        align-self: flex-start;
        background-color: #e9ecef;
        color: black;
        border-bottom-left-radius: 5px;
      }
      #message-form {
        display: flex;
        gap: 10px;
      }
      #message-input {
        flex-grow: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
      }
      button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }

      /* Settings styles */
      .setting-row {
        margin-bottom: 15px;
      }
      .setting-row label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .setting-row input {
        padding: 8px;
        width: 100%;
        max-width: 200px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>AI Assistant</h1>

    <div id="tabs">
      <div class="tab-button active" data-tab="chat-tab">Chat</div>
      <div class="tab-button" data-tab="settings-tab">Settings</div>
    </div>

    <div id="chat-tab" class="tab-content active">
      <div id="chat-container"></div>
      <form id="message-form">
        <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>

    <div id="settings-tab" class="tab-content">
      <div class="setting-row">
        <label for="context-length-input">Context Length (tokens)</label>
        <input type="number" id="context-length-input" />
      </div>
      <div class="setting-row">
        <button id="save-settings-btn">Save Settings</button>
        <button id="reset-btn" style="background-color: #dc3545; margin-left: 10px;">Reset Conversation</button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
